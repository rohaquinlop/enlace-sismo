name: Deploy

on:
  push:
    branches: [main]
  # Refresco manual del baseline SSG: reconstruye la web con los datos
  # actuales del repo sin esperar un deploy de código (desacoplar-datos-deploy).
  workflow_dispatch:

jobs:
  deploy:
    name: Publicar a Cloudflare
    runs-on: ubuntu-latest
    # El paso de snapshot commitea reportes-ayuda.json: el GITHUB_TOKEN del
    # workflow necesita escritura de contents (si el repo limita el default).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # El filtro de despliegue compara event.before vs sha con git diff:
          # con shallow clone (default) el commit anterior no existe y el paso
          # falla con "bad object". Historial completo (repo pequeño).
          fetch-depth: 0

      # Despliegue selectivo (desacoplar-datos-deploy): los cambios SOLO de
      # datos — catálogos (data/** sin data/schema/**) y el registro en vivo
      # (web/public/datos/**, commiteado por el worker) — se publican vía
      # GET /api/datos/:catalogo sin deploy (GitHub como almacén + caché KV).
      # El pipeline corre solo con cambios de código o por workflow_dispatch.
      - name: ¿Cambios de código?
        id: filtro
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "desplegar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "desplegar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARCHIVOS="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          echo "Archivos en este push:"
          echo "$ARCHIVOS"
          if [ -z "$ARCHIVOS" ]; then
            echo "desplegar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r f; do
            case "$f" in
              # Los schemas los importa el worker en build: su cambio SÍ despliega.
              data/schema/*) echo "desplegar=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              data/*) ;;
              web/public/datos/*) ;;
              *) echo "desplegar=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done <<< "$ARCHIVOS"
          echo "desplegar=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.filtro.outputs.desplegar == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.filtro.outputs.desplegar == 'true'
        run: npm ci

      - name: Validar datos
        if: steps.filtro.outputs.desplegar == 'true'
        run: npm run validate:data

      - name: Aplicar migraciones D1
        if: steps.filtro.outputs.desplegar == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply enlace-sismo --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar worker (API)
        if: steps.filtro.outputs.desplegar == 'true'
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar web (Pages)
        if: steps.filtro.outputs.desplegar == 'true'
        working-directory: web
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name enlace-sismo --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Snapshot del registro de puntos de ayuda (puntos-de-ayuda): D1 es la
      # fuente de verdad; el snapshot alimenta el baseline SSG/offline de la
      # web (reportes-ayuda.json, validado en CI). Se valida con validate:data
      # antes de commitear (la proyección no debe romper el schema). Es
      # web/public/datos/** → no vuelve a disparar el deploy (filtro selectivo).
      - name: Snapshot del registro de ayuda (SSG)
        if: steps.filtro.outputs.desplegar == 'true'
        run: |
          curl -fsSL --retry 3 "https://api.enlacesismo.com/api/ayuda" -o web/public/datos/reportes-ayuda.json
          npm run validate:data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/datos/reportes-ayuda.json
          git diff --cached --quiet || git commit -m "datos: snapshot del registro de ayuda (post-deploy)"
          git push
