name = "enlace-sismo-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# API pública del proyecto: https://api.enlacesismo.com
# Requiere que el dominio esté en la misma cuenta Cloudflare (custom_domain).
routes = [
  { pattern = "api.enlacesismo.com", custom_domain = true },
]

# Crea el KV con: wrangler kv namespace create ENLACE_SISMO
# Luego reemplaza id con el valor generado.
[[kv_namespaces]]
binding = "KV"
id = "d2cff2fc01b148d9bb11581d63c4e3f5"

# Crea el bucket R2 con: wrangler r2 bucket create enlace-sismo-imagenes
# Luego el binding ya está configurado abajo.
[[r2_buckets]]
binding = "IMAGENES"
bucket_name = "enlace-sismo-imagenes"

# Crea la base con: wrangler d1 create enlace-sismo
# Luego reemplaza id con el valor generado.
[[d1_databases]]
binding = "ENLACE_SISMO_DB"
database_name = "enlace-sismo"
database_id = "336dc46e-f776-4855-aa46-44f187059118"

[vars]
PUBLIC_ORIGIN = "https://enlacesismo.com"

# Secreto requerido para la moderación de puntos de rescate
# (POST /api/puntos/:id/estado — falso/promovido):
#   wrangler secret put ADMIN_TOKEN
